<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Mud's Blog</title>
  <script>(()=>{try{const t=localStorage.getItem('mud-blog-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch{}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/assets/style.css?v={{ asset_v }}" />
</head>
<body>
  <main class="post-shell">
    <article class="post-reader">
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p>This address does not match a published page.</p>
      <p><a href="/">Home</a> · <a href="/news/">News</a></p>
    </article>
  </main>
</body>
</html>
