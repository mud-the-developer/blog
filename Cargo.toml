[package]
name = "mud-blog"
version = "0.1.0"
edition = "2024"

[lib]
name = "mud_blog"
path = "src/lib.rs"

[[bin]]
name = "mud-blog"
path = "src/main.rs"

[dependencies]
askama = "0.12"
axum = "0.8"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace"] }
