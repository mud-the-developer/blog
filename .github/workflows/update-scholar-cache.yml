name: Update Scholar Cache

on:
  schedule:
    - cron: "45 0 * * *" # Daily 09:45 KST (after upstream 09:17 KST scrape)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar-cache
  cancel-in-progress: true

jobs:
  sync-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Sync Google Scholar publication cache
        run: python3 scripts/sync_scholar_metrics.py

      - name: Commit updated Scholar cache
        run: |
          set -euo pipefail
          if git diff --quiet -- data/scholar/publications.json; then
            echo "No Scholar cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar/publications.json
          git commit -m "Sync cached Google Scholar citation metrics"
          git pull --rebase origin main
          git push origin HEAD:main
