name: Update CFP Radar

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional issue date (YYYY-MM-DD). Defaults to KST today."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-cfp-radar
  cancel-in-progress: false

jobs:
  update-cfp:
    # ICC omits an intermediate; Windows native TLS can complete its chain.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Generate CFP Radar artifacts
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GOOGLE_AI_MODEL: ${{ vars.GOOGLE_AI_MODEL }}
          CFP_AI_FALLBACK_ENABLED: "1"
          CFP_AI_MAX_REQUESTS: "3"
          CFP_AI_TARGETS: "ICNC,ICC"
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${INPUT_DATE:-}" ]]; then
            args+=(--date "${INPUT_DATE}")
          fi
          cargo run -- cfp update "${args[@]}"
          cargo run -- cfp validate
          npm run build
          npm test
          npm run lint

      - name: Commit and push CFP artifacts
        run: |
          set -euo pipefail
          paths=(data/cfp posts/cfp static/cfp)

          if git diff --quiet -- "${paths[@]}"; then
            echo "No CFP Radar changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${paths[@]}"
          issue_date="$(date +%F)"
          git commit -m "Refresh daily CFP Radar for ${issue_date}"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "CFP artifacts pushed; deploy runs via workflow_run."
