name: Update News Digest

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news-digest
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh news source submodule
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --remote -- vendor/blog_news

      - name: Generate news digest artifacts
        run: |
          set -euo pipefail
          python3 scripts/generate_news_digest.py

      - name: Commit and push changes
        run: |
          set -euo pipefail

          if git diff --quiet -- vendor/blog_news content/generated/news content/posts/news; then
            echo "No news changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vendor/blog_news content/generated/news content/posts/news
          issue_date="$(date +%F)"
          git commit -m "Refresh the daily news digest for ${issue_date}"
          git push origin HEAD:main
