name: Update News Digest

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news-digest
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      NEWS_REPO_TOKEN: ${{ secrets.NEWS_REPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh private news source
        if: ${{ env.NEWS_REPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          rm -rf vendor/blog_news
          git clone --depth 1 "https://x-access-token:${NEWS_REPO_TOKEN}@github.com/mud-the-developer/blog_news.git" vendor/blog_news

      - name: Use committed news snapshot fallback
        if: ${{ env.NEWS_REPO_TOKEN == '' }}
        run: |
          echo "::notice::NEWS_REPO_TOKEN is not configured. Skipping private news refresh."

      - name: Generate news digest artifacts
        if: ${{ env.NEWS_REPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          python3 scripts/generate_news_digest.py

      - name: Commit and push changes
        if: ${{ env.NEWS_REPO_TOKEN != '' }}
        run: |
          set -euo pipefail

          if git diff --quiet -- vendor/blog_news content/generated/news content/posts/news static/news/data; then
            echo "No news changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vendor/blog_news content/generated/news content/posts/news static/news/data
          issue_date="$(date +%F)"
          git commit -m "Refresh the daily news digest for ${issue_date}"
          git push origin HEAD:main
