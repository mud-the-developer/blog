name: Update News Digest

on:
  schedule:
    - cron: "20 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional issue date (YYYY-MM-DD). Defaults to KST today."
        required: false
        type: string
      keywords:
        description: "Optional comma-separated keyword focus for a manual issue."
        required: false
        type: string
      mempalace_limit:
        description: "Maximum local MemPalace context drawers if a palace is available."
        required: false
        default: "6"
        type: string

permissions:
  contents: write

concurrency:
  group: update-news-digest
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      NEWS_REPO_TOKEN: ${{ secrets.NEWS_REPO_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_AI_MODEL: ${{ vars.GOOGLE_AI_MODEL }}
      ENABLE_GEMMA_BETA_DIGEST: ${{ vars.ENABLE_GEMMA_BETA_DIGEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Refresh private news source
        if: ${{ env.NEWS_REPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          rm -rf vendor/blog_news
          git clone --depth 1 "https://x-access-token:${NEWS_REPO_TOKEN}@github.com/mud-the-developer/blog_news.git" vendor/blog_news

      - name: Use committed news snapshot fallback
        if: ${{ env.NEWS_REPO_TOKEN == '' }}
        run: |
          echo "::warning::NEWS_REPO_TOKEN is not configured. Generating the digest from the committed snapshot fallback."

      - name: Validate news source freshness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          candidates = [
              Path("vendor/blog_news/data/latest.json"),
              Path("static/news/data/latest.json"),
          ]
          source_path = next((path for path in candidates if path.exists()), None)
          if source_path is None:
              raise SystemExit("no news source payload found")

          data = json.loads(source_path.read_text())
          generated_raw = data.get("generatedAt")
          if not generated_raw:
              raise SystemExit(f"{source_path} is missing generatedAt")

          generated_at = datetime.fromisoformat(generated_raw.replace("Z", "+00:00"))
          age_hours = (datetime.now(timezone.utc) - generated_at).total_seconds() / 3600
          errors = data.get("errors") or []
          hard_errors = [
              error for error in errors
              if "GitHub fetch error" in error or "rate limit" in error.lower()
          ]
          source_counts = data.get("sourceCounts") or {}
          paper_count_raw = data.get("paperCount")
          if isinstance(paper_count_raw, int):
              paper_count = paper_count_raw
          else:
              paper_count = len(data.get("papers") or [])

          if age_hours > 36:
              raise SystemExit(
                  f"news source is stale: {source_path} was generated {age_hours:.1f}h ago"
              )
          if hard_errors:
              raise SystemExit("blocking source errors: " + " | ".join(hard_errors))
          if source_counts.get("github.com", 0) < 8:
              raise SystemExit("github.com coverage is too low in the source payload")
          if paper_count < 8:
              raise SystemExit("paper coverage is too low in the source payload")

          print(
              f"validated source payload {source_path}: age={age_hours:.1f}h, "
              f"github={source_counts.get('github.com', 0)}, "
              f"papers={paper_count}"
          )
          PY

      - name: Generate news digest artifacts
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_KEYWORDS: ${{ github.event.inputs.keywords }}
          INPUT_MEMPALACE_LIMIT: ${{ github.event.inputs.mempalace_limit }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${INPUT_DATE:-}" ]]; then
            args+=(--date "${INPUT_DATE}")
          fi
          if [[ -n "${INPUT_KEYWORDS:-}" ]]; then
            args+=(--keywords "${INPUT_KEYWORDS}")
          fi
          if [[ -n "${INPUT_MEMPALACE_LIMIT:-}" ]]; then
            args+=(--mempalace-limit "${INPUT_MEMPALACE_LIMIT}")
          fi
          python3 scripts/generate_news_digest.py "${args[@]}"

      - name: Commit and push news artifacts
        run: |
          set -euo pipefail
          paths=(data/news posts/news static/news/data static/news/assets)

          if git diff --quiet -- "${paths[@]}"; then
            echo "No news changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${paths[@]}"
          issue_date="$(date +%F)"
          git commit -m "Refresh the daily news digest for ${issue_date}"
          git push origin HEAD:main

          echo "Pushed news artifacts to main; Deploy Cloudflare Pages will run from the Update News Digest workflow_run event."
