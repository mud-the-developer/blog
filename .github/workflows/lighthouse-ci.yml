name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'tests/browser/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lighthouse-ci.yml'

jobs:
  lighthouse:
    name: Lighthouse CI (mobile + desktop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Start local server
        run: cargo run --quiet -- serve --host 127.0.0.1 --port 4173 &
        shell: bash
        env:
          RUST_LOG: warn

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:4173/posts/home/ >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time"
          exit 1

      - name: Run Lighthouse CI
        run: node node_modules/@lhci/cli/src/cli.js autorun --config=.github/lighthouserc.json