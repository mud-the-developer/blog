name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_TITLE: ${{ vars.SITE_TITLE }}
      SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
      SITE_AUTHOR: ${{ vars.SITE_AUTHOR }}
      SITE_LANGUAGE: ${{ vars.SITE_LANGUAGE }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Cloudflare configuration
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "GitHub secret CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "GitHub secret CLOUDFLARE_ACCOUNT_ID is required."
            exit 1
          fi

          if ! [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[A-Za-z0-9]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID looks invalid. It should be your 32-character Account ID."
            exit 1
          fi

      - name: Verify Cloudflare token
        run: npx wrangler@4 whoami

      - name: Build static site
        run: |
          set -euo pipefail

          if [[ -z "${SITE_URL:-}" ]]; then
            SITE_URL="https://mud-blog.pages.dev"
          fi

          build_args=(--site-url "$SITE_URL")

          if [[ -n "${SITE_TITLE:-}" ]]; then
            build_args+=(--title "$SITE_TITLE")
          fi

          if [[ -n "${SITE_DESCRIPTION:-}" ]]; then
            build_args+=(--description "$SITE_DESCRIPTION")
          fi

          if [[ -n "${SITE_AUTHOR:-}" ]]; then
            build_args+=(--author "$SITE_AUTHOR")
          fi

          if [[ -n "${SITE_LANGUAGE:-}" ]]; then
            build_args+=(--language "$SITE_LANGUAGE")
          fi

          cargo run -p blog-build -- "${build_args[@]}"

      - name: Check performance budgets
        run: ./scripts/check-performance-budget.sh dist

      - name: Check internal HTML links
        run: ./scripts/check-html-links.sh dist

      - name: Deploy to Cloudflare Pages
        run: |
          set -euo pipefail

          if [[ -z "${CF_PAGES_PROJECT:-}" ]]; then
            echo "Repository variable CF_PAGES_PROJECT is required."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "GitHub secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            exit 1
          fi

          npx wrangler@4 pages deploy dist --project-name "$CF_PAGES_PROJECT"
