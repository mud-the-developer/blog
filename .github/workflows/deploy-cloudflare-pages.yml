name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_AI_MODEL: ${{ vars.GOOGLE_AI_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare configuration
        run: |
          set -euo pipefail
          if [[ -z "${CF_PAGES_PROJECT:-}" ]]; then
            echo "Repository variable CF_PAGES_PROJECT is required."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "GitHub secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            exit 1
          fi
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[A-Za-z0-9]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID looks invalid. It should be your 32-character Account ID."
            exit 1
          fi

      - name: Verify Cloudflare token
        run: npx wrangler@4 whoami

      - name: Build and verify static site
        run: |
          set -euo pipefail
          npm run build
          npm test
          npm run lint

      - name: Sync Google AI secret to Cloudflare Pages
        if: ${{ env.GOOGLE_AI_API_KEY != '' || env.GOOGLE_API_KEY != '' || env.GEMINI_API_KEY != '' }}
        run: |
          set -euo pipefail
          key="${GOOGLE_AI_API_KEY:-${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}}"
          if [[ -z "${key}" ]]; then
            echo "No Google AI key secret to sync."
            exit 0
          fi
          printf '%s' "${key}" | npx wrangler@4 pages secret put GOOGLE_AI_API_KEY --project-name "${CF_PAGES_PROJECT}"
          echo "Synced GOOGLE_AI_API_KEY to Cloudflare Pages secrets."

      - name: Sync Google AI model variable to Cloudflare Pages
        if: ${{ env.GOOGLE_AI_MODEL != '' }}
        run: |
          set -euo pipefail
          printf '%s' "${GOOGLE_AI_MODEL}" | npx wrangler@4 pages secret put GOOGLE_AI_MODEL --project-name "${CF_PAGES_PROJECT}"
          echo "Synced GOOGLE_AI_MODEL to Cloudflare Pages environment."

      - name: Deploy to Cloudflare Pages
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy dist \
            --project-name "${CF_PAGES_PROJECT}" \
            --branch "${GITHUB_REF_NAME:-main}" \
            --commit-hash "${GITHUB_SHA}"
