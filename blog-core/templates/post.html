{% extends "base.html" %}

{% block content %}
  <article class="panel note">
    <header class="note-header">
      <h1>{{ post.title }}</h1>
      <p class="post-meta">{{ post.date_display }} • {{ post.reading_time_min }} min read</p>
      {% if post.tags.len() > 0 %}
      <div class="tag-wrap">
        {% for tag in post.tags %}
        <a class="tag" href="/tags/{{ tag.slug }}/">#{{ tag.name }}</a>
        {% endfor %}
      </div>
      {% endif %}
    </header>
    {{ body_html|safe }}
  </article>
{% endblock %}
