{% extends "base.html" %}

{% block extra_styles %}
  <link rel="stylesheet" href="/assets/style-listing.css?v={{ layout.asset_version }}" />
{% endblock %}

{% block content %}
  <section class="panel not-found content-shell content-shell--reading">
    <p class="section-kicker">Unpublished</p>
    <h1>{{ missing_title }}</h1>
    <p>This note is referenced, but it is not published in this garden yet.</p>
    <p class="post-meta">Requested path: /notes/{{ missing_slug }}/</p>
    <p class="post-cta"><a class="post-cta-link" href="/">Go back home</a></p>
  </section>
{% endblock %}
