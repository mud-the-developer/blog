{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <h1>Knowledge Graph</h1>
    <p class="post-meta">{{ node_count }} notes • {{ link_count }} links</p>
    <p class="post-meta">Click a node to open the note. Drag nodes to re-balance local clusters.</p>
  </section>

  <section class="panel graph-panel">
    <div class="graph-toolbar">
      <label for="graph-search">Search</label>
      <input id="graph-search" type="search" placeholder="Find note by title or slug" autocomplete="off" />
      <button id="graph-reset" type="button">Reset Layout</button>
      <button id="graph-toggle" type="button">Pause</button>
      <a class="graph-data-link" href="/graph.json">Raw JSON</a>
    </div>

    <div id="graph-stage" class="graph-stage">
      <svg id="graph-svg" viewBox="0 0 1000 640" aria-label="Knowledge graph visualization">
        <g id="graph-link-layer"></g>
        <g id="graph-node-layer"></g>
      </svg>
    </div>

    <aside id="graph-detail" class="graph-detail">
      Hover over a note to inspect relationships.
    </aside>
  </section>

  <script>
    (() => {
      const stage = document.getElementById("graph-stage");
      const svg = document.getElementById("graph-svg");
      const linkLayer = document.getElementById("graph-link-layer");
      const nodeLayer = document.getElementById("graph-node-layer");
      const detail = document.getElementById("graph-detail");
      const searchInput = document.getElementById("graph-search");
      const resetButton = document.getElementById("graph-reset");
      const toggleButton = document.getElementById("graph-toggle");

      if (!stage || !svg || !linkLayer || !nodeLayer || !detail || !searchInput || !resetButton || !toggleButton) {
        return;
      }

      const ns = "http://www.w3.org/2000/svg";
      const width = 1000;
      const height = 640;
      const centerX = width / 2;
      const centerY = height / 2;

      const createSvgEl = (name) => document.createElementNS(ns, name);
      const graphState = {
        nodes: [],
        links: [],
        running: true,
        dragging: null,
        activeNodeId: "",
        searchTerm: ""
      };

      const pointInSvg = (event) => {
        const rect = svg.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * width,
          y: ((event.clientY - rect.top) / rect.height) * height
        };
      };

      const resetLayout = () => {
        const count = Math.max(graphState.nodes.length, 1);
        const radius = Math.min(width, height) * 0.34;
        graphState.nodes.forEach((node, index) => {
          const angle = (Math.PI * 2 * index) / count;
          node.x = centerX + Math.cos(angle) * radius;
          node.y = centerY + Math.sin(angle) * radius;
          node.vx = 0;
          node.vy = 0;
        });
      };

      const updateDetail = (node) => {
        if (!node) {
          detail.textContent = "Hover over a note to inspect relationships.";
          return;
        }

        const outgoing = graphState.links.filter((link) => link.source === node.id).length;
        const incoming = graphState.links.filter((link) => link.target === node.id).length;
        detail.innerHTML = "<strong>" + node.title + "</strong> (" + node.id + ") • " + incoming + " incoming • " + outgoing + " outgoing";
      };

      const applyVisualState = () => {
        const active = graphState.activeNodeId;
        const query = graphState.searchTerm;
        const adjacency = new Map();
        graphState.nodes.forEach((node) => adjacency.set(node.id, new Set([node.id])));
        graphState.links.forEach((link) => {
          if (adjacency.has(link.source)) adjacency.get(link.source).add(link.target);
          if (adjacency.has(link.target)) adjacency.get(link.target).add(link.source);
        });

        graphState.nodes.forEach((node) => {
          const matchesSearch = query.length === 0
            || node.title.toLowerCase().includes(query)
            || node.id.toLowerCase().includes(query);
          const inFocus = active.length === 0 || adjacency.get(active).has(node.id);
          const isActive = active.length > 0 && node.id === active;

          node.el.classList.toggle("is-active", isActive);
          node.el.classList.toggle("is-dim", !matchesSearch || !inFocus);
        });

        graphState.links.forEach((link) => {
          const hasActive = active.length > 0 && (link.source === active || link.target === active);
          const sourceNode = graphState.nodesById.get(link.source);
          const targetNode = graphState.nodesById.get(link.target);
          const visibleBySearch = sourceNode && targetNode
            && !sourceNode.el.classList.contains("is-dim")
            && !targetNode.el.classList.contains("is-dim");

          link.el.classList.toggle("is-active", hasActive);
          link.el.classList.toggle("is-dim", !visibleBySearch || (active.length > 0 && !hasActive));
        });
      };

      const tick = () => {
        if (!graphState.running) {
          requestAnimationFrame(tick);
          return;
        }

        const repulsion = 1900;
        const spring = 0.018;
        const damping = 0.86;
        const centerPull = 0.003;

        for (let i = 0; i < graphState.nodes.length; i += 1) {
          const a = graphState.nodes[i];
          for (let j = i + 1; j < graphState.nodes.length; j += 1) {
            const b = graphState.nodes[j];
            let dx = a.x - b.x;
            let dy = a.y - b.y;
            let dist2 = dx * dx + dy * dy;
            if (dist2 < 25) dist2 = 25;
            const force = repulsion / dist2;
            const dist = Math.sqrt(dist2);
            dx /= dist;
            dy /= dist;

            a.vx += dx * force;
            a.vy += dy * force;
            b.vx -= dx * force;
            b.vy -= dy * force;
          }
        }

        graphState.links.forEach((link) => {
          const source = graphState.nodesById.get(link.source);
          const target = graphState.nodesById.get(link.target);
          if (!source || !target) return;

          let dx = target.x - source.x;
          let dy = target.y - source.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const ideal = 120;
          const pull = (dist - ideal) * spring;
          dx /= dist;
          dy /= dist;

          source.vx += dx * pull;
          source.vy += dy * pull;
          target.vx -= dx * pull;
          target.vy -= dy * pull;
        });

        graphState.nodes.forEach((node) => {
          if (graphState.dragging === node.id) {
            node.vx = 0;
            node.vy = 0;
            return;
          }

          node.vx += (centerX - node.x) * centerPull;
          node.vy += (centerY - node.y) * centerPull;
          node.vx *= damping;
          node.vy *= damping;
          node.x += node.vx;
          node.y += node.vy;
        });

        graphState.links.forEach((link) => {
          const source = graphState.nodesById.get(link.source);
          const target = graphState.nodesById.get(link.target);
          if (!source || !target) return;
          link.el.setAttribute("x1", String(source.x));
          link.el.setAttribute("y1", String(source.y));
          link.el.setAttribute("x2", String(target.x));
          link.el.setAttribute("y2", String(target.y));
        });

        graphState.nodes.forEach((node) => {
          node.el.setAttribute("transform", "translate(" + node.x + "," + node.y + ")");
        });

        requestAnimationFrame(tick);
      };

      const attachDragEvents = () => {
        svg.addEventListener("pointermove", (event) => {
          if (!graphState.dragging) return;
          const node = graphState.nodesById.get(graphState.dragging);
          if (!node) return;
          const point = pointInSvg(event);
          node.x = point.x;
          node.y = point.y;
        });

        svg.addEventListener("pointerup", () => {
          graphState.dragging = "";
          svg.classList.remove("is-dragging");
        });

        svg.addEventListener("pointerleave", () => {
          graphState.dragging = "";
          svg.classList.remove("is-dragging");
        });
      };

      fetch("/graph.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Failed to load graph.json");
          }
          return response.json();
        })
        .then((payload) => {
          const nodes = Array.isArray(payload.nodes) ? payload.nodes : [];
          const links = Array.isArray(payload.links) ? payload.links : [];

          if (nodes.length === 0) {
            detail.textContent = "No graph data available yet.";
            return;
          }

          graphState.nodes = nodes.map((node) => ({
            id: node.id,
            title: node.title,
            url: node.url,
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            el: null
          }));
          graphState.links = links.map((link) => ({
            source: link.source,
            target: link.target,
            el: null
          }));
          graphState.nodesById = new Map(graphState.nodes.map((node) => [node.id, node]));

          resetLayout();

          graphState.links.forEach((link) => {
            const line = createSvgEl("line");
            line.classList.add("graph-link");
            line.setAttribute("stroke-linecap", "round");
            linkLayer.appendChild(line);
            link.el = line;
          });

          graphState.nodes.forEach((node) => {
            const group = createSvgEl("g");
            group.classList.add("graph-node");

            const circle = createSvgEl("circle");
            circle.setAttribute("r", "9");
            group.appendChild(circle);

            const label = createSvgEl("text");
            label.setAttribute("x", "13");
            label.setAttribute("y", "4");
            label.textContent = node.title;
            group.appendChild(label);

            group.addEventListener("mouseenter", () => {
              graphState.activeNodeId = node.id;
              updateDetail(node);
              applyVisualState();
            });

            group.addEventListener("mouseleave", () => {
              graphState.activeNodeId = "";
              updateDetail(null);
              applyVisualState();
            });

            group.addEventListener("click", () => {
              window.location.href = node.url;
            });

            group.addEventListener("pointerdown", (event) => {
              event.preventDefault();
              graphState.dragging = node.id;
              svg.classList.add("is-dragging");
            });

            nodeLayer.appendChild(group);
            node.el = group;
          });

          attachDragEvents();

          searchInput.addEventListener("input", () => {
            graphState.searchTerm = searchInput.value.trim().toLowerCase();
            applyVisualState();
          });

          resetButton.addEventListener("click", () => {
            resetLayout();
            applyVisualState();
          });

          toggleButton.addEventListener("click", () => {
            graphState.running = !graphState.running;
            toggleButton.textContent = graphState.running ? "Pause" : "Resume";
          });

          applyVisualState();
          requestAnimationFrame(tick);
        })
        .catch(() => {
          detail.textContent = "Failed to load graph data.";
        });
    })();
  </script>
{% endblock %}
