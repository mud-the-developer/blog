{% extends "base.html" %}

{% block extra_styles %}
  <link rel="stylesheet" href="/assets/style-graph.css" />
  <link rel="stylesheet" href="/assets/style-graph-page.css" />
{% endblock %}

{% block content %}
  <section class="panel graph-panel">
    <header class="graph-head">
      <p class="section-kicker">Knowledge Map</p>
      <h1>Graph</h1>
      <p class="post-meta">{{ total_nodes }} notes • {{ total_links }} links</p>
    </header>

    <div class="graph-stage-wrap">
      <div id="global-graph-stage" class="graph-stage">
        <svg id="global-graph-svg" width="1000" height="640" viewBox="0 0 1000 640" aria-label="Global graph view">
          <g id="global-graph-link-layer"></g>
          <g id="global-graph-node-layer"></g>
        </svg>
      </div>
      <p id="global-graph-status" class="graph-status" role="status" aria-live="polite">Loading graph map...</p>
      <div class="graph-zoom-control">
        <button
          id="global-graph-reset"
          class="graph-icon-button graph-zoom-button"
          type="button"
          aria-label="Reset graph view"
          title="Reset graph view"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 11a8 8 0 1 0-2.3 5.7"></path>
            <path d="M20 4v7h-7"></path>
          </svg>
          <span class="sr-only">Reset graph view</span>
        </button>
        <div class="graph-zoom-buttons" role="group" aria-label="Graph zoom controls">
          <button
            id="global-graph-zoom-in"
            class="graph-icon-button graph-zoom-button"
            type="button"
            aria-label="Zoom in"
            title="Zoom in"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>
            <span class="sr-only">Zoom in</span>
          </button>
          <button
            id="global-graph-zoom-out"
            class="graph-icon-button graph-zoom-button"
            type="button"
            aria-label="Zoom out"
            title="Zoom out"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h14"></path>
            </svg>
            <span class="sr-only">Zoom out</span>
          </button>
        </div>
      </div>
    </div>
    <p id="global-graph-detail" class="graph-detail" role="status" aria-live="polite">
      Hover nodes to inspect relationships.
    </p>

  </section>
{% endblock %}
