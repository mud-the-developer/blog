{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <h1>Knowledge Graph</h1>
    <p class="post-meta">{{ node_count }} notes • {{ link_count }} links</p>
    <p class="post-meta">Click a node to open the note. Drag nodes to re-balance local clusters.</p>
  </section>

  <section class="panel graph-panel">
    <div class="graph-toolbar">
      <label for="full-graph-search">Search</label>
      <input id="full-graph-search" type="search" placeholder="Find note by title or slug" autocomplete="off" />
      <button id="full-graph-reset" type="button">Reset Layout</button>
      <button id="full-graph-toggle" type="button">Pause</button>
      <a class="graph-data-link" href="/graph.json">Raw JSON</a>
    </div>

    <div id="full-graph-stage" class="graph-stage">
      <svg id="full-graph-svg" viewBox="0 0 1000 640" aria-label="Knowledge graph visualization">
        <g id="full-graph-link-layer"></g>
        <g id="full-graph-node-layer"></g>
      </svg>
    </div>

    <aside id="full-graph-detail" class="graph-detail">
      Hover over a note to inspect relationships.
    </aside>
  </section>
{% endblock %}
