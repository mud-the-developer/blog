{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <h1>#{{ tag_name }}</h1>
    <p class="post-meta">Posts related to this topic</p>
  </section>

  <section class="post-list">
    {% for post in posts %}
    <article class="panel post-item">
      <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
      <p class="post-meta">{{ post.date_display }} • {{ post.reading_time_min }} min read</p>
      <p>{{ post.excerpt }}</p>
    </article>
    {% endfor %}
  </section>
{% endblock %}
